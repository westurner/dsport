[package]
name = "docindexrs-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"
description = "Command line interface for DocIndex"

[[bin]]
name = "docindex"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
docindexrs-core = { path = "../docindexrs-core" }
docindexrs-native = { path = "../docindexrs-native" }
nbconvertrs = { path = "../sustainablefactory/src/transform_md" }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
