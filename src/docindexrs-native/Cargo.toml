[package]
name = "docindexrs-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "BSD-2-Clause"
description = "Native filesystem and artifact adapters for DocIndex"

[lib]
name = "docindexrs_native"
path = "src/lib.rs"

[dependencies]
docindexrs-core = { path = "../docindexrs-core" }
nbconvertrs = { path = "../sustainablefactory/src/transform_md" }
nbformat = { path = "../runtimed/crates/nbformat", version = "3.0.0" }
rdfhdt = { path = "../rdfhdt" }
reqwest = { version = "0.11", default-features = false, features = [
	"blocking",
	"json",
	"rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
