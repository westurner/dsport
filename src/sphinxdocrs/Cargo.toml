[package]
name = "sphinxdocrs"
version = "0.0.1"
edition.workspace = true
# Sphinx is licensed under BSD-2-Clause; see LICENSE.sphinx at the workspace root.
license-file = "../../LICENSE.sphinx"
rust-version.workspace = true
description = "Rust port of Sphinxdoc"
keywords = ["sphinx", "documentation", "generator", "builder"]
categories = ["text-processing", "development-tools"]
homepage = "https://github.com/westurner/dsport/tree/main/src/sphinxdocrs"
repository = "https://github.com/westurner/dsport"
#documentation = "https://sphinxdocrs.readthedocs.io"
# Upstream sphinxdoc:
#   homepage = "https://www.sphinx-doc.org/"
#   documentation = "https://www.sphinx-doc.org/"
#   repository = "https://github.com/sphinx-doc/sphinx"

[lib]
name = "sphinxdocrs"
crate-type = ["cdylib", "rlib"]

[features]
# Build mode: compile as Python extension module (don't embed libpython).
# Propagates to docutilsrs and its optional components.
extension-module = ["pyo3/extension-module", "docutilsrs/extension-module", "docutilsrs/syntax-highlighting"]

# Optional components (included by default).
# Syntax highlighting support (propagates to docutilsrs).
syntax-highlighting = ["docutilsrs/syntax-highlighting"]

# Snowball stemming for search index term keys, covering every language in
# `sphinx.search.languages`. Required for parity with Python's
# `snowballstemmer`; disable to index the lowercased surface form instead.
search-stemming = ["dep:rust-stemmers"]

# Use an in-process `reqwest` HTTP client instead of shelling out to `curl`
# for `intersphinx` inventory downloads and `linkcheck` URI checks. Off by
# default — `curl` needs no extra dependencies and is already hardened the
# same way. When compiled in, select it at runtime (no rebuild needed to
# switch back) with the `SPHINXDOCRS_HTTP_CLIENT=reqwest` environment
# variable; any other value, or this feature being disabled, uses `curl`.
http-reqwest = ["dep:reqwest"]

# Default feature set.
default = ["syntax-highlighting", "search-stemming"]

## Test suite features

# Gate cross-language parity tests (requires Python + upstream sphinx in PATH).
test-parity = []

# Gate parity tests that spawn full sphinx-build -b json (memory-intensive).
# Implies test-parity. Use: --features test-parity,test-parity-jsonbuilder
test-parity-jsonbuilder = ["test-parity"]

# Gate tests that build real docs trees with sphinx-build-rs vs sphinx-build.
test-build-extdocs = []


[dependencies]
pyo3 = { workspace = true, features = ["auto-initialize"] }
regex = "1.10"
glob = "0.3"
clap = { workspace = true }
jinja2rs = { path = "../jinja2rs" }
markupsafers = { path = "../markupsafers", features = ["minijinja"] }
docutilsrs = { path = "../docutilsrs" }
pygmentsrs = { path = "../pygmentsrs" }
minijinja = { path = "../minijinja/minijinja" }
unicode-width = "0.2"
num_cpus = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
# Civil-date decomposition for `intl::format_date`. Already in the workspace
# lockfile via `docutilsrs`, so this adds no new transitive dependencies.
chrono = "0.4"
# zlib codec for `objects.inv` inventory payloads. Already in the workspace
# lockfile, so this adds no new transitive dependencies.
flate2 = "1"
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15" }
# Snowball stemmers, generated from the same upstream sources as Python's
# `snowballstemmer`. Has no transitive dependencies with default features off.
rust-stemmers = { version = "1.2", default-features = false, optional = true }
# In-process HTTP client, gated behind the `http-reqwest` feature (see
# above). Pinned to "0.11" to match the version already resolved via
# `rvcr`'s dependency chain (a dev-dependency), so enabling this feature
# does not pull in a second major `reqwest` version.
reqwest = { version = "0.11", default-features = false, features = [
    "blocking",
    "rustls-tls",
], optional = true }

[dev-dependencies]
insta = { workspace = true }
rstest = { workspace = true }
snapbox = { workspace = true }
mockall = { workspace = true }
wiremock = { workspace = true }
rvcr = { workspace = true }
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# Async runtime required only to drive `wiremock::MockServer` in
# `tests/linkcheck_wiremock.rs`; the code under test remains synchronous.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "otherdocs"
path = "tests/otherdocs.rs"
required-features = ["test-build-extdocs"]

[[bench]]
name = "sphinxdocrs"
harness = false

[[bin]]
name = "sphinx-build-rs"
path = "src/bin/sphinx_build.rs"

[[bin]]
name = "sphinx-quickstart-rs"
path = "src/bin/sphinx_quickstart.rs"

[[bin]]
name = "sphinx-apidoc-rs"
path = "src/bin/sphinx_apidoc.rs"

[[bin]]
name = "sphinx-autogen-rs"
path = "src/bin/sphinx_autogen.rs"
